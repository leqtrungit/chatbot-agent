[project]
name = "chatbot-agent-backend"
version = "0.1.0"
description = "Generic domain-knowledge chatbot agent platform - backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "jinja2>=3.1",
    "mcp>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "aiosqlite>=0.20",
    "fakeredis>=2.26",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

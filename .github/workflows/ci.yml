name: ci

on:
  pull_request:
    branches: "*"
  push:
    branches:
      - develop
      - main
      - refactor/**

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot
          POSTGRES_DB: chatbot
        options: >-
          --health-cmd="pg_isready -U chatbot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Run tests
        working-directory: backend
        run: uv run pytest -q
        env:
          DATABASE_URL: postgresql+asyncpg://chatbot:chatbot@localhost:5432/chatbot
          REDIS_URL: redis://localhost:6379/0

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint

  keycloak-integration:
    name: Keycloak Integration
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if realm config exists
        id: realm_check
        run: |
          if [ -f "infra/keycloak/realm-export.json" ]; then
            echo "realm_exists=true" >> $GITHUB_OUTPUT
          else
            echo "realm_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Start Keycloak container
        if: steps.realm_check.outputs.realm_exists == 'true'
        run: |
          docker run -d \
            --name keycloak \
            -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v ${{ github.workspace }}/infra/keycloak:/opt/keycloak/data/import \
            quay.io/keycloak/keycloak:26.3 \
            start-dev --import-realm

      - name: Wait for Keycloak to start
        if: steps.realm_check.outputs.realm_exists == 'true'
        run: sleep 10

      - name: Verify JWKS endpoint
        if: steps.realm_check.outputs.realm_exists == 'true'
        run: |
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            response=$(curl -s -w "\n%{http_code}" \
              http://localhost:8080/realms/harness/protocol/openid-connect/certs)
            http_code=$(echo "$response" | tail -n 1)
            body=$(echo "$response" | head -n -1)

            if [ "$http_code" = "200" ] && echo "$body" | grep -q '"keys"'; then
              echo "✓ JWKS endpoint returned 200 with keys"
              exit 0
            fi

            attempt=$((attempt + 1))
            if [ $attempt -lt $max_attempts ]; then
              sleep 1
            fi
          done

          echo "✗ JWKS endpoint did not return valid response"
          exit 1

      - name: Skip Keycloak test
        if: steps.realm_check.outputs.realm_exists == 'false'
        run: |
          echo "⊘ Skipping Keycloak integration test: realm-export.json not found"
          echo "  (realm config will be provided by task T1)"
